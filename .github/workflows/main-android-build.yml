name: Build Audio Projects — main

on:
  push:
    branches: [ main ]
    paths:
      - 'branch-archive/main/**'
      - '.github/workflows/main-android-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'branch-archive/main/**'
      - '.github/workflows/main-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-phab:
    name: Build Phab Audio Bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore deduplicated source files
        run: python3 .github/scripts/restore_archive_duplicates.py --branch 'main'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Prepare and validate BatteryPulse signing key
        env:
          BATTERYPULSE_KEYSTORE_BASE64: ${{ secrets.BATTERYPULSE_KEYSTORE_BASE64 }}
          BATTERYPULSE_STORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          BATTERYPULSE_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          BATTERYPULSE_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$BATTERYPULSE_KEYSTORE_BASE64" ] || [ -z "$BATTERYPULSE_STORE_PASSWORD" ] || [ -z "$BATTERYPULSE_KEY_ALIAS" ] || [ -z "$BATTERYPULSE_KEY_PASSWORD" ]; then
            echo "BatteryPulse signing secrets are incomplete. Configure the same existing repository Actions secrets used by D.S Launcher." >&2
            exit 1
          fi
          printf '%s' "$BATTERYPULSE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/batterypulse-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/batterypulse-release.p12" -storepass "$BATTERYPULSE_STORE_PASSWORD" -alias "$BATTERYPULSE_KEY_ALIAS" >/dev/null
          chmod 600 "$RUNNER_TEMP/batterypulse-release.p12"
          echo "Existing BatteryPulse signing key validated."


      - name: Build debug and signed release APKs
        working-directory: branch-archive/main/phab-bridge
        env:
          BATTERYPULSE_KEYSTORE_PATH: ${{ runner.temp }}/batterypulse-release.p12
          BATTERYPULSE_STORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          BATTERYPULSE_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          BATTERYPULSE_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Verify signed phone APK
        working-directory: branch-archive/main/phab-bridge
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APK_SIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APK_SIGNER" && test -x "$APK_SIGNER"
          test -s "$APK"
          "$APK_SIGNER" verify --verbose "$APK"
          cp "$APK" "app/build/outputs/apk/release/PhoneBridge-Phone-signed.apk"

      - name: Package reversible Magisk privileged-app test module
        run: |
          set -euo pipefail
          MODULE_ROOT="$RUNNER_TEMP/phonebridge-privileged-module"
          MODULE_ZIP="$RUNNER_TEMP/PhoneBridge-Privileged-Test-Magisk.zip"
          APK="branch-archive/main/phab-bridge/app/build/outputs/apk/release/PhoneBridge-Phone-signed.apk"
          mkdir -p "$MODULE_ROOT/system/priv-app/PhoneBridge" "$MODULE_ROOT/META-INF/com/google/android"
          cp "$APK" "$MODULE_ROOT/system/priv-app/PhoneBridge/PhoneBridge.apk"
          cat > "$MODULE_ROOT/module.prop" <<'EOF'
          id=phonebridge_privileged_capture
          name=PhoneBridge Privileged Capture Test
          version=1.0
          versionCode=1
          author=DS-ann
          description=Reversible systemless privileged install test for CAPTURE_AUDIO_OUTPUT on Android 6; remove this module in Magisk to revert.
          EOF
          curl -fsSL "https://raw.githubusercontent.com/topjohnwu/Magisk/v30.7/scripts/module_installer.sh" -o "$MODULE_ROOT/META-INF/com/google/android/update-binary"
          printf '#MAGISK\n' > "$MODULE_ROOT/META-INF/com/google/android/updater-script"
          chmod 0755 "$MODULE_ROOT/META-INF/com/google/android/update-binary"
          chmod 0644 "$MODULE_ROOT/META-INF/com/google/android/updater-script" "$MODULE_ROOT/module.prop" "$MODULE_ROOT/system/priv-app/PhoneBridge/PhoneBridge.apk"
          (cd "$MODULE_ROOT" && zip -qr "$MODULE_ZIP" .)
          unzip -t "$MODULE_ZIP"
          unzip -l "$MODULE_ZIP"

      - name: Upload privileged-app test module
        uses: actions/upload-artifact@v7
        with:
          name: PhoneBridge-Privileged-Test-Magisk.zip
          path: ${{ runner.temp }}/PhoneBridge-Privileged-Test-Magisk.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Package reversible Magisk privileged-app test module
        run: |
          set -euo pipefail
          MODULE_ROOT="$RUNNER_TEMP/phonebridge-privileged-module"
          MODULE_ZIP="$RUNNER_TEMP/PhoneBridge-Privileged-Test-Magisk.zip"
          APK="branch-archive/main/phab-bridge/app/build/outputs/apk/release/PhoneBridge-Phone-signed.apk"
          mkdir -p "$MODULE_ROOT/system/priv-app/PhoneBridge" "$MODULE_ROOT/META-INF/com/google/android"
          cp "$APK" "$MODULE_ROOT/system/priv-app/PhoneBridge/PhoneBridge.apk"
          cat > "$MODULE_ROOT/module.prop" <<'EOF'
          id=phonebridge_privileged_capture
          name=PhoneBridge Privileged Capture Test
          version=1.0
          versionCode=1
          author=DS-ann
          description=Reversible systemless privileged install test for CAPTURE_AUDIO_OUTPUT on Android 6; remove this module in Magisk to revert.
          EOF
          curl -fsSL "https://raw.githubusercontent.com/topjohnwu/Magisk/v30.7/scripts/module_installer.sh" -o "$MODULE_ROOT/META-INF/com/google/android/update-binary"
          printf '#MAGISK\n' > "$MODULE_ROOT/META-INF/com/google/android/updater-script"
          chmod 0755 "$MODULE_ROOT/META-INF/com/google/android/update-binary"
          chmod 0644 "$MODULE_ROOT/META-INF/com/google/android/updater-script" "$MODULE_ROOT/module.prop" "$MODULE_ROOT/system/priv-app/PhoneBridge/PhoneBridge.apk"
          (cd "$MODULE_ROOT" && zip -qr "$MODULE_ZIP" .)
          unzip -t "$MODULE_ZIP"
          unzip -l "$MODULE_ZIP"

      - name: Upload privileged-app test module
        uses: actions/upload-artifact@v7
        with:
          name: PhoneBridge-Privileged-Test-Magisk.zip
          path: ${{ runner.temp }}/PhoneBridge-Privileged-Test-Magisk.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload direct phone APK
        uses: actions/upload-artifact@v7
        with:
          path: branch-archive/main/phab-bridge/app/build/outputs/apk/release/PhoneBridge-Phone-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

  build-pad:
    name: Build Pad Audio Bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore deduplicated source files
        run: python3 .github/scripts/restore_archive_duplicates.py --branch 'main'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Prepare and validate BatteryPulse signing key
        env:
          BATTERYPULSE_KEYSTORE_BASE64: ${{ secrets.BATTERYPULSE_KEYSTORE_BASE64 }}
          BATTERYPULSE_STORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          BATTERYPULSE_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          BATTERYPULSE_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$BATTERYPULSE_KEYSTORE_BASE64" ] || [ -z "$BATTERYPULSE_STORE_PASSWORD" ] || [ -z "$BATTERYPULSE_KEY_ALIAS" ] || [ -z "$BATTERYPULSE_KEY_PASSWORD" ]; then
            echo "BatteryPulse signing secrets are incomplete. Configure the same existing repository Actions secrets used by D.S Launcher." >&2
            exit 1
          fi
          printf '%s' "$BATTERYPULSE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/batterypulse-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/batterypulse-release.p12" -storepass "$BATTERYPULSE_STORE_PASSWORD" -alias "$BATTERYPULSE_KEY_ALIAS" >/dev/null
          chmod 600 "$RUNNER_TEMP/batterypulse-release.p12"
          echo "Existing BatteryPulse signing key validated."


      - name: Build debug and signed release APKs
        working-directory: branch-archive/main/pad-client
        env:
          BATTERYPULSE_KEYSTORE_PATH: ${{ runner.temp }}/batterypulse-release.p12
          BATTERYPULSE_STORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          BATTERYPULSE_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          BATTERYPULSE_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Verify signed tablet APK
        working-directory: branch-archive/main/pad-client
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APK_SIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APK_SIGNER" && test -x "$APK_SIGNER"
          test -s "$APK"
          "$APK_SIGNER" verify --verbose "$APK"
          cp "$APK" "app/build/outputs/apk/release/PhoneBridge-Tablet-signed.apk"

      - name: Upload direct tablet APK
        uses: actions/upload-artifact@v7
        with:
          path: branch-archive/main/pad-client/app/build/outputs/apk/release/PhoneBridge-Tablet-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
