plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsann.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.dsann.launcher'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
