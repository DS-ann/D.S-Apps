name: Build Launcher APK

on:
  push:
    branches: [launcher-app]
  workflow_dispatch:

permissions:
  contents: read

# Only build the latest launcher commit; older builds are superseded on rapid fixes.
concurrency:
  group: launcher-app-build
  cancel-in-progress: true

jobs:
  build:
    name: Build and sign Launcher APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Disable Gradle's persisted dependency/build caches for a clean diagnostic build.
      - name: Set up Gradle without cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35,build-tools;35.0.0'

      - name: Prepare and validate BatteryPulse signing key
        env:
          BATTERYPULSE_KEYSTORE_BASE64: ${{ secrets.BATTERYPULSE_KEYSTORE_BASE64 }}
          BATTERYPULSE_STORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          BATTERYPULSE_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$BATTERYPULSE_KEYSTORE_BASE64" ] || [ -z "$BATTERYPULSE_STORE_PASSWORD" ] || [ -z "$BATTERYPULSE_KEY_ALIAS" ]; then
            echo "BatteryPulse signing secrets are incomplete. Configure the existing repository Actions secrets." >&2
            exit 1
          fi
          printf '%s' "$BATTERYPULSE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/batterypulse-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/batterypulse-release.p12" -storepass "$BATTERYPULSE_STORE_PASSWORD" -alias "$BATTERYPULSE_KEY_ALIAS" >/dev/null
          chmod 600 "$RUNNER_TEMP/batterypulse-release.p12"
          echo "BatteryPulse PKCS12 keystore validated."

      - name: Clean and build signed release APK without caches
        env:
          BATTERYPULSE_KEYSTORE_PATH: ${{ runner.temp }}/batterypulse-release.p12
          BATTERYPULSE_STORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          BATTERYPULSE_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          BATTERYPULSE_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
        run: gradle --no-daemon --no-build-cache --no-configuration-cache --stacktrace clean assembleRelease

      - name: Verify release APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APK_SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          test -x "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose "$APK"
          echo "Signed launcher release APK verified."

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Launcher-release-signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
