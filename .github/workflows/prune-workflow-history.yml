name: Keep only the two latest workflow runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-workflow-history.yml'

permissions:
  actions: write
  contents: write

jobs:
  prune-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete older workflow runs and their artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          CURRENT_RUN_ID = int(os.environ["CURRENT_RUN_ID"])
          API = f"https://api.github.com/repos/{REPO}"
          HEADERS = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "D-S-Apps-workflow-history-cleanup",
          }

          def request(path, method="GET"):
              req = urllib.request.Request(API + path, headers=HEADERS, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = response.read()
                      if not body:
                          return response.status, None
                      return response.status, json.loads(body.decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  if exc.code == 404:
                      return 404, {"message": body}
                  if exc.code in (409, 422) and method == "POST":
                      return exc.code, {"message": body}
                  raise RuntimeError(f"{method} {path} failed: HTTP {exc.code}: {body}") from exc

          def pages(path, key):
              page = 1
              collected = []
              while True:
                  separator = "&" if "?" in path else "?"
                  status, result = request(f"{path}{separator}per_page=100&page={page}")
                  if status != 200:
                      raise RuntimeError(f"Could not list {path}: HTTP {status}")
                  batch = result.get(key, [])
                  collected.extend(batch)
                  if len(batch) < 100:
                      return collected
                  page += 1

          def all_runs():
              runs = pages("/actions/runs", "workflow_runs")
              if not any(int(run["id"]) == CURRENT_RUN_ID for run in runs):
                  status, current = request(f"/actions/runs/{CURRENT_RUN_ID}")
                  if status != 200:
                      raise RuntimeError("The current cleanup run is not visible through the GitHub API.")
                  runs.append(current)
              unique = {int(run["id"]): run for run in runs}
              return sorted(unique.values(), key=lambda r: (r.get("created_at", ""), int(r["id"])), reverse=True)

          def delete_artifacts(run_id):
              artifacts = pages(f"/actions/runs/{run_id}/artifacts", "artifacts")
              removed = 0
              for artifact in artifacts:
                  status, _ = request(f"/actions/artifacts/{artifact['id']}", "DELETE")
                  if status in (200, 202, 204, 404):
                      if status != 404:
                          removed += 1
                  else:
                      raise RuntimeError(f"Could not delete artifact {artifact['id']} (run {run_id}): HTTP {status}")
              return removed

          runs = all_runs()
          if len(runs) < 2:
              raise RuntimeError(f"Found only {len(runs)} workflow runs; refusing to delete history.")
          keep = runs[:2]
          keep_ids = {int(run["id"]) for run in keep}
          print("Preserving the two newest workflow runs:")
          for run in keep:
              print(f"  KEEP id={run['id']} created={run['created_at']} status={run['status']} name={run['name']}")
          remove = [run for run in runs if int(run["id"]) not in keep_ids]
          print(f"Will remove {len(remove)} older workflow runs and every artifact attached to them.")

          live_statuses = {"queued", "in_progress", "waiting", "pending", "requested", "cancel_requested"}
          for run in remove:
              run_id = int(run["id"])
              if run.get("status") in live_statuses:
                  status, result = request(f"/actions/runs/{run_id}/cancel", "POST")
                  if status not in (200, 202, 204, 404, 409, 422):
                      raise RuntimeError(f"Could not cancel older run {run_id}: HTTP {status}")
                  print(f"Requested cancellation for older active run {run_id}.")

          deadline = time.time() + 8 * 60
          active_ids = {int(run["id"]) for run in remove if run.get("status") in live_statuses}
          while active_ids and time.time() < deadline:
              still_active = set()
              for run_id in active_ids:
                  status, current = request(f"/actions/runs/{run_id}")
                  if status == 200 and current.get("status") in live_statuses:
                      still_active.add(run_id)
              active_ids = still_active
              if active_ids:
                  time.sleep(3)
          if active_ids:
              raise RuntimeError("Some older runs are still cancelling; no workflow-run deletion was attempted for them: " + ", ".join(map(str, sorted(active_ids))))

          deleted_artifacts = 0
          deleted_runs = 0
          for run in remove:
              run_id = int(run["id"])
              deleted_artifacts += delete_artifacts(run_id)
              status, _ = request(f"/actions/runs/{run_id}", "DELETE")
              if status in (200, 202, 204, 404):
                  if status != 404:
                      deleted_runs += 1
                      print(f"Deleted workflow run {run_id}.")
              else:
                  raise RuntimeError(f"Could not delete workflow run {run_id}: HTTP {status}")

          # Final sweep removes any orphaned/leftover artifact not owned by either retained run.
          leftover_artifacts = pages("/actions/artifacts", "artifacts")
          orphaned_removed = 0
          for artifact in leftover_artifacts:
              run_info = artifact.get("workflow_run") or {}
              owner_id = run_info.get("id")
              if owner_id is None or int(owner_id) not in keep_ids:
                  status, _ = request(f"/actions/artifacts/{artifact['id']}", "DELETE")
                  if status in (200, 202, 204):
                      orphaned_removed += 1
                  elif status != 404:
                      raise RuntimeError(f"Could not delete leftover artifact {artifact['id']}: HTTP {status}")

          remaining = all_runs()
          remaining_ids = {int(run["id"]) for run in remaining}
          if remaining_ids != keep_ids:
              extras = remaining_ids - keep_ids
              missing = keep_ids - remaining_ids
              raise RuntimeError(f"Final verification failed. Extra run IDs: {sorted(extras)}; missing retained IDs: {sorted(missing)}")
          remaining_artifacts = pages("/actions/artifacts", "artifacts")
          unwanted_artifacts = [
              artifact for artifact in remaining_artifacts
              if (artifact.get("workflow_run") or {}).get("id") is None
              or int(artifact["workflow_run"]["id"]) not in keep_ids
          ]
          if unwanted_artifacts:
              raise RuntimeError("Final verification found artifacts outside the two retained runs: " + ", ".join(str(a["id"]) for a in unwanted_artifacts))

          print(f"SUCCESS: exactly {len(remaining)} workflow runs remain.")
          print(f"Deleted {deleted_runs} older runs, {deleted_artifacts} run-attached artifacts, and {orphaned_removed} orphaned artifacts.")
          print("All artifacts belonging to the two retained runs were preserved.")
          PY

      - name: Remove this temporary cleanup workflow file
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          FILE_SHA="$(git rev-parse HEAD:.github/workflows/prune-workflow-history.yml)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/prune-workflow-history.yml" \
            -f message="Remove temporary workflow-history cleanup helper" \
            -f sha="$FILE_SHA" \
            -f branch=main
