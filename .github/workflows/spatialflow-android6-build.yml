name: Build SpatialFlow APK first, then test Android 6 (ARM64-v8a)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/spatialflow-android6-build.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: SpatialFlow source ref to build for the ARM64-v8a release
        required: true
        type: string
        default: master
      run_api23_smoke_test:
        description: Run optional Android 6 emulator smoke test
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spatialflow-arm64-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build SpatialFlow with a per-run temporary key
    uses: DS-ann/SpatialFlow/.github/workflows/android6-apk.yml@master
    with:
      source_ref: ${{ inputs.source_ref || 'master' }}
      run_api23_smoke_test: ${{ inputs.run_api23_smoke_test || false }}
