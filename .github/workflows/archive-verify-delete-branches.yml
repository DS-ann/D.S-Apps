name: Verify archive and delete consolidated branches

on:
  push:
    branches: [ main ]
    paths:
      - 'branch-archive/**'
      - '.github/scripts/restore_archive_duplicates.py'
      - '.github/workflows/archive-verify-delete-branches.yml'

permissions:
  contents: write

jobs:
  verify-and-delete:
    if: github.event.head_commit.message == 'Consolidate all branches under main archive'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidated main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify each source snapshot before deleting refs
        run: |
          set -euo pipefail
          for branch in \
            'main' \
            'battery-monitor' \
            'battery-monitor-tab-android16' \
            'fix/auto-call-audio' \
            'launcher-app' \
            'test-call-bluetooth-audio-route'; do
            python3 .github/scripts/restore_archive_duplicates.py --branch "$branch"
          done
          test -f .github/workflows/main-android-build.yml
          test -f .github/workflows/battery-monitor-android-build.yml
          test -f .github/workflows/battery-monitor-tab-android16-android-build.yml
          test -f .github/workflows/fix-auto-call-audio-android-build.yml
          test -f .github/workflows/test-call-bluetooth-audio-route-android-build.yml
          test -f .github/workflows/battery-monitor-build.yml
          test -f .github/workflows/battery-monitor-tab-android16-build.yml
          test -f .github/workflows/launcher-app-build.yml
          grep -q 'branch-archive/main/phab-bridge' .github/workflows/main-android-build.yml
          grep -q 'branch-archive/battery-monitor/battery-monitor' .github/workflows/battery-monitor-build.yml
          grep -q 'branch-archive/battery-monitor-tab-android16/battery-monitor' .github/workflows/battery-monitor-tab-android16-build.yml
          grep -q 'branch-archive/fix/auto-call-audio/phab-bridge' .github/workflows/fix-auto-call-audio-android-build.yml
          grep -q 'branch-archive/test-call-bluetooth-audio-route/phab-bridge' .github/workflows/test-call-bluetooth-audio-route-android-build.yml
          grep -q 'branch-archive/launcher-app' .github/workflows/launcher-app-build.yml
          echo 'Archive content and workflow paths verified.'

      - name: Verify archived branch heads before deleting any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cat > /tmp/expected-branches.tsv <<'EOF'
          battery-monitor 0656e6c9efddc226ecf12d88b82042d20c7555f3
          battery-monitor-tab-android16 ec544a6b072b5ae895ef49a44f8e62a7411e8096
          fix/auto-call-audio 0c9a11699d2a6984492d900e26f86bf4b37fc780
          launcher-app c45491aec532d850fafab0643e2208e17cfd03d9
          test-call-bluetooth-audio-route 0ef2f5634d102f8c82d0863957a9a1080617c15e
          EOF
          while read -r branch expected; do
            actual="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -n "$actual" ] && [ "$actual" != "$expected" ]; then
              echo "::error::Branch $branch moved after archiving (expected $expected, found $actual); refusing to delete any branches."
              exit 1
            fi
          done < /tmp/expected-branches.tsv

      - name: Delete archived non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          while read -r branch expected; do
            actual="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -n "$actual" ]; then
              git push origin --delete "$branch"
              echo "Deleted archived branch: $branch"
            else
              echo "Branch already absent: $branch"
            fi
          done < /tmp/expected-branches.tsv
          echo "Archived non-main branches deleted; main retained."
