name: Keep only two workflow runs (fast cleanup)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-workflow-history-v2.yml'

permissions:
  actions: write
  contents: write

jobs:
  prune-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cancel slower cleanup attempt and remove old runs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          CURRENT_RUN_ID = int(os.environ["CURRENT_RUN_ID"])
          PREVIOUS_CLEANUP_RUN_ID = 39399694272
          API = f"https://api.github.com/repos/{REPO}"
          HEADERS = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "D-S-Apps-workflow-history-cleanup",
          }
          HELPERS = {
              ".github/workflows/prune-workflow-history.yml",
              ".github/workflows/prune-workflow-history-v2.yml",
          }

          class ApiError(RuntimeError):
              pass

          def request(path, method="GET", retries=8):
              for attempt in range(retries):
                  req = urllib.request.Request(API + path, headers=HEADERS, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=60) as response:
                          body = response.read()
                          if not body:
                              return response.status, None
                          try:
                              return response.status, json.loads(body.decode("utf-8"))
                          except json.JSONDecodeError:
                              return response.status, None
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")
                      if exc.code == 404:
                          return 404, {"message": body}
                      if exc.code in (409, 422) and method in ("POST", "DELETE"):
                          return exc.code, {"message": body}
                      if exc.code in (403, 429, 500, 502, 503, 504):
                          retry_after = exc.headers.get("Retry-After")
                          wait = float(retry_after) if retry_after else min(60, 2 ** min(attempt + 1, 6))
                          if attempt + 1 >= retries:
                              raise ApiError(f"{method} {path} failed after retries: HTTP {exc.code}: {body}") from exc
                          time.sleep(wait)
                          continue
                      raise ApiError(f"{method} {path} failed: HTTP {exc.code}: {body}") from exc
                  except (TimeoutError, urllib.error.URLError) as exc:
                      if attempt + 1 >= retries:
                          raise ApiError(f"{method} {path} failed after retries: {exc}") from exc
                      time.sleep(min(60, 2 ** min(attempt + 1, 6)))
              raise ApiError(f"{method} {path} exhausted retries")

          def pages(path, key):
              out = []
              page = 1
              while True:
                  status, data = request(f"{path}?per_page=100&page={page}")
                  if status != 200 or not isinstance(data, dict):
                      raise ApiError(f"Could not list {path}: HTTP {status}")
                  batch = data.get(key, [])
                  out.extend(batch)
                  if len(batch) < 100:
                      return out
                  page += 1

          def list_runs():
              rows = pages("/actions/runs", "workflow_runs")
              seen = {int(x["id"]) for x in rows}
              if CURRENT_RUN_ID not in seen:
                  status, current = request(f"/actions/runs/{CURRENT_RUN_ID}")
                  if status != 200:
                      raise ApiError("Current cleanup run was not returned by GitHub.")
                  rows.append(current)
              return {int(x["id"]): x for x in rows}

          def cancel_if_live(run_id):
              status, run = request(f"/actions/runs/{run_id}")
              if status == 404:
                  return
              if status != 200:
                  raise ApiError(f"Could not inspect run {run_id}: HTTP {status}")
              if run.get("status") in {"queued", "in_progress", "waiting", "pending", "requested", "cancel_requested"}:
                  cstatus, _ = request(f"/actions/runs/{run_id}/cancel", "POST")
                  if cstatus not in (200, 202, 204, 404, 409, 422):
                      raise ApiError(f"Could not cancel run {run_id}: HTTP {cstatus}")

          # Stop the earlier, slow cleanup so the two deletion passes do not race.
          cancel_if_live(PREVIOUS_CLEANUP_RUN_ID)
          end = time.time() + 300
          while time.time() < end:
              status, old = request(f"/actions/runs/{PREVIOUS_CLEANUP_RUN_ID}")
              if status == 404 or (status == 200 and old.get("status") == "completed"):
                  break
              time.sleep(2)
          else:
              raise ApiError("The previous cleanup run did not stop; refusing to run two cleanup passes concurrently.")

          live_states = {"queued", "in_progress", "waiting", "pending", "requested", "cancel_requested"}
          runs = list_runs()
          current = runs[CURRENT_RUN_ID]
          candidates = [
              run for run in runs.values()
              if int(run["id"]) != CURRENT_RUN_ID
              and run.get("path", "").split("@", 1)[0] not in HELPERS
              and not any(helper in run.get("path", "") for helper in HELPERS)
          ]
          candidates.sort(key=lambda r: (r.get("created_at", ""), int(r["id"])), reverse=True)
          if not candidates:
              raise ApiError("No non-cleanup workflow run exists to retain alongside this cleanup run.")
          keep = {CURRENT_RUN_ID, int(candidates[0]["id"])}
          print("Retaining the cleanup run and newest non-cleanup run:")
          for run_id in keep:
              run = runs.get(run_id)
              if run:
                  print(f"  KEEP id={run_id} created={run.get('created_at')} name={run.get('name')} status={run.get('status')}")
          remove = [run for run in runs.values() if int(run["id"]) not in keep]
          print(f"Found {len(runs)} workflow-run records; deleting {len(remove)} older records.")
          live_to_cancel = [
              int(run["id"]) for run in remove
              if run.get("status") in live_states
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(cancel_if_live, live_to_cancel))
          deadline = time.time() + 8 * 60
          pending = set(live_to_cancel)
          while pending and time.time() < deadline:
              def current_status(run_id):
                  status, row = request(f"/actions/runs/{run_id}")
                  if status == 404:
                      return run_id, "completed"
                  if status != 200:
                      raise ApiError(f"Could not poll old run {run_id}: HTTP {status}")
                  return run_id, row.get("status")
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                  statuses = list(pool.map(current_status, pending))
              pending = {run_id for run_id, state in statuses if state in live_states}
              if pending:
                  time.sleep(3)
          if pending:
              raise ApiError("Older runs are still active after cancellation: " + ", ".join(map(str, sorted(pending))))

          failures = []
          deleted = 0
          def delete_run(run):
              run_id = int(run["id"])
              status, result = request(f"/actions/runs/{run_id}", "DELETE")
              if status in (200, 202, 204, 404):
                  return run_id, status, None
              return run_id, status, str(result)

          # GitHub removes artifacts automatically when their associated run is deleted.
          # Parallel deletion avoids taking hours for a repository with >1,000 runs.
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              future_map = {pool.submit(delete_run, run): int(run["id"]) for run in remove}
              completed = 0
              for future in concurrent.futures.as_completed(future_map):
                  run_id, status, error = future.result()
                  completed += 1
                  if error:
                      failures.append((run_id, status, error))
                  elif status != 404:
                      deleted += 1
                  if completed % 50 == 0:
                      print(f"Processed {completed}/{len(remove)} old runs.")
          if failures:
              raise ApiError("Run deletions failed: " + "; ".join(f"{run_id}: HTTP {status} {error}" for run_id, status, error in failures[:20]))

          # Audit for artifacts that are not associated with either retained run.
          artifacts = pages("/actions/artifacts", "artifacts")
          extras = [
              artifact for artifact in artifacts
              if (artifact.get("workflow_run") or {}).get("id") is None
              or int(artifact["workflow_run"]["id"]) not in keep
          ]
          if extras:
              def delete_artifact(artifact):
                  status, result = request(f"/actions/artifacts/{artifact['id']}", "DELETE")
                  if status in (200, 202, 204, 404):
                      return artifact["id"], status, None
                  return artifact["id"], status, str(result)
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  artifact_results = list(pool.map(delete_artifact, extras))
              artifact_failures = [item for item in artifact_results if item[2]]
              if artifact_failures:
                  raise ApiError("Some leftover artifacts could not be deleted: " + repr(artifact_failures[:20]))

          remaining = list_runs()
          ids = set(remaining)
          if ids != keep:
              raise ApiError(f"Verification failed; remaining extra IDs={sorted(ids - keep)}, missing IDs={sorted(keep - ids)}")
          remaining_artifacts = pages("/actions/artifacts", "artifacts")
          unwanted = [
              item for item in remaining_artifacts
              if (item.get("workflow_run") or {}).get("id") is None
              or int(item["workflow_run"]["id"]) not in keep
          ]
          if unwanted:
              raise ApiError("Artifacts remain outside the two retained runs: " + ", ".join(str(a["id"]) for a in unwanted))
          print(f"SUCCESS: exactly two workflow runs remain, with no artifacts outside those two runs.")
          print(f"Deleted {deleted} old workflow runs and automatically removed their attached artifacts.")
          PY

      - name: Remove temporary cleanup workflow files
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for path in \
            '.github/workflows/prune-workflow-history.yml' \
            '.github/workflows/prune-workflow-history-v2.yml'; do
            if [ -f "$path" ]; then
              FILE_SHA="$(git rev-parse "HEAD:$path")"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/$path" \
                -f message="Remove temporary workflow history cleanup helper" \
                -f sha="$FILE_SHA" \
                -f branch=main
            fi
          done
