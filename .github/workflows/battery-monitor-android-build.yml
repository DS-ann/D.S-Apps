name: Build Audio Projects — battery-monitor

on:
  push:
    branches: [ main ]
    paths:
      - 'branch-archive/battery-monitor/**'
      - '.github/workflows/battery-monitor-android-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'branch-archive/battery-monitor/**'
      - '.github/workflows/battery-monitor-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-phab:
    name: Build Phab Audio Bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore deduplicated source files
        run: python3 .github/scripts/restore_archive_duplicates.py --branch 'battery-monitor'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build Phab audio bridge
        working-directory: branch-archive/battery-monitor/phab-bridge
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Phab APK
        uses: actions/upload-artifact@v4
        with:
          name: phonebridge-phab-audio-debug
          path: branch-archive/battery-monitor/phab-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-pad:
    name: Build Pad Audio Bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore deduplicated source files
        run: python3 .github/scripts/restore_archive_duplicates.py --branch 'battery-monitor'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build Pad audio bridge
        working-directory: branch-archive/battery-monitor/pad-client
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Pad APK
        uses: actions/upload-artifact@v4
        with:
          name: phonebridge-pad-audio-debug
          path: branch-archive/battery-monitor/pad-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
