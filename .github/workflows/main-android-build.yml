name: Build Audio Projects — main

on:
  push:
    branches: [ main ]
    paths:
      - 'branch-archive/main/**'
      - '.github/workflows/main-android-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'branch-archive/main/**'
      - '.github/workflows/main-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-phab:
    name: Build Phab Audio Bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore deduplicated source files
        run: python3 .github/scripts/restore_archive_duplicates.py --branch 'main'

      - name: Build bundled TinyALSA tinymix for Android 6+
        env:
          TINYALSA_COMMIT: bbdba1e208f402c5b7d5cb3d42307a3db9f6bb1c
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          NDK_VERSION="26.3.11579264"
          NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -f "$NDK_ROOT/build/cmake/android.toolchain.cmake" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -z "$SDKMANAGER" ]; then
              echo "Android SDK manager not found; cannot install the NDK needed for tinymix." >&2
              exit 1
            fi
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "ndk;$NDK_VERSION" "cmake;3.22.1"
          fi
          test -f "$NDK_ROOT/build/cmake/android.toolchain.cmake"
          export PATH="$SDK_ROOT/cmake/3.22.1/bin:$PATH"
          command -v cmake >/dev/null
          TINYALSA_SOURCE="$RUNNER_TEMP/tinyalsa"
          git clone --quiet https://github.com/tinyalsa/tinyalsa.git "$TINYALSA_SOURCE"
          git -C "$TINYALSA_SOURCE" checkout --quiet --detach "$TINYALSA_COMMIT"
          ASSET_ROOT="$GITHUB_WORKSPACE/branch-archive/main/phab-bridge/app/src/main/assets/tinymix"
          mkdir -p "$ASSET_ROOT"
          cp "$TINYALSA_SOURCE/LICENSE" "$ASSET_ROOT/LICENSE"
          for ABI in arm64-v8a armeabi-v7a; do
            BUILD_DIR="$RUNNER_TEMP/tinyalsa-build-$ABI"
            cmake -S "$TINYALSA_SOURCE" -B "$BUILD_DIR" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-23 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DTINYALSA_USES_PLUGINS=OFF \
              -DTINYALSA_BUILD_EXAMPLES=OFF \
              -DTINYALSA_BUILD_UTILS=ON
            cmake --build "$BUILD_DIR" --target tinymix --parallel 2
            TINYMIX_BIN="$BUILD_DIR/tinymix"
            if [ ! -x "$TINYMIX_BIN" ]; then
              TINYMIX_BIN="$(find "$BUILD_DIR" -type f -name tinymix -perm -u+x -print -quit)"
            fi
            test -n "$TINYMIX_BIN" && test -x "$TINYMIX_BIN"
            mkdir -p "$ASSET_ROOT/$ABI"
            install -m 0755 "$TINYMIX_BIN" "$ASSET_ROOT/$ABI/tinymix"
            file "$ASSET_ROOT/$ABI/tinymix"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Prepare and validate BatteryPulse signing key
        env:
          BATTERYPULSE_KEYSTORE_BASE64: ${{ secrets.BATTERYPULSE_KEYSTORE_BASE64 }}
          BATTERYPULSE_STORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          BATTERYPULSE_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          BATTERYPULSE_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$BATTERYPULSE_KEYSTORE_BASE64" ] || [ -z "$BATTERYPULSE_STORE_PASSWORD" ] || [ -z "$BATTERYPULSE_KEY_ALIAS" ] || [ -z "$BATTERYPULSE_KEY_PASSWORD" ]; then
            echo "BatteryPulse signing secrets are incomplete. Configure the same existing repository Actions secrets used by D.S Launcher." >&2
            exit 1
          fi
          printf '%s' "$BATTERYPULSE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/batterypulse-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/batterypulse-release.p12" -storepass "$BATTERYPULSE_STORE_PASSWORD" -alias "$BATTERYPULSE_KEY_ALIAS" >/dev/null
          chmod 600 "$RUNNER_TEMP/batterypulse-release.p12"
          echo "Existing BatteryPulse signing key validated."


      - name: Build debug and signed release APKs
        working-directory: branch-archive/main/phab-bridge
        env:
          BATTERYPULSE_KEYSTORE_PATH: ${{ runner.temp }}/batterypulse-release.p12
          BATTERYPULSE_STORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          BATTERYPULSE_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          BATTERYPULSE_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Verify signed phone APK
        working-directory: branch-archive/main/phab-bridge
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APK_SIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APK_SIGNER" && test -x "$APK_SIGNER"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/tinymix/arm64-v8a/tinymix'
          unzip -l "$APK" | grep -q 'assets/tinymix/armeabi-v7a/tinymix'
          unzip -l "$APK" | grep -q 'assets/tinymix/LICENSE'
          "$APK_SIGNER" verify --verbose "$APK"
          cp "$APK" "app/build/outputs/apk/release/PhoneBridge-Phone-signed.apk"

      - name: Upload direct phone APK
        uses: actions/upload-artifact@v7
        with:
          path: branch-archive/main/phab-bridge/app/build/outputs/apk/release/PhoneBridge-Phone-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

  build-pad:
    name: Build Pad Audio Bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore deduplicated source files
        run: python3 .github/scripts/restore_archive_duplicates.py --branch 'main'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Prepare and validate BatteryPulse signing key
        env:
          BATTERYPULSE_KEYSTORE_BASE64: ${{ secrets.BATTERYPULSE_KEYSTORE_BASE64 }}
          BATTERYPULSE_STORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          BATTERYPULSE_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          BATTERYPULSE_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$BATTERYPULSE_KEYSTORE_BASE64" ] || [ -z "$BATTERYPULSE_STORE_PASSWORD" ] || [ -z "$BATTERYPULSE_KEY_ALIAS" ] || [ -z "$BATTERYPULSE_KEY_PASSWORD" ]; then
            echo "BatteryPulse signing secrets are incomplete. Configure the same existing repository Actions secrets used by D.S Launcher." >&2
            exit 1
          fi
          printf '%s' "$BATTERYPULSE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/batterypulse-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/batterypulse-release.p12" -storepass "$BATTERYPULSE_STORE_PASSWORD" -alias "$BATTERYPULSE_KEY_ALIAS" >/dev/null
          chmod 600 "$RUNNER_TEMP/batterypulse-release.p12"
          echo "Existing BatteryPulse signing key validated."


      - name: Build debug and signed release APKs
        working-directory: branch-archive/main/pad-client
        env:
          BATTERYPULSE_KEYSTORE_PATH: ${{ runner.temp }}/batterypulse-release.p12
          BATTERYPULSE_STORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          BATTERYPULSE_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          BATTERYPULSE_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Verify signed tablet APK
        working-directory: branch-archive/main/pad-client
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APK_SIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APK_SIGNER" && test -x "$APK_SIGNER"
          test -s "$APK"
          "$APK_SIGNER" verify --verbose "$APK"
          cp "$APK" "app/build/outputs/apk/release/PhoneBridge-Tablet-signed.apk"

      - name: Upload direct tablet APK
        uses: actions/upload-artifact@v7
        with:
          path: branch-archive/main/pad-client/app/build/outputs/apk/release/PhoneBridge-Tablet-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
